# FoodPlanner Production — Docker Hub Image + PostgreSQL
# Usage:
#   1. Create .env file (copy from .env.example)
#   2. Run: docker compose up -d
#
# Image: milkrunner/foodplanner (built via GitHub Actions)

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodplanner-db
    environment:
      POSTGRES_DB: foodplanner
      POSTGRES_USER: foodplanner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodplanner -d foodplanner"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: milkrunner/foodplanner:${VERSION:-latest}
    container_name: foodplanner
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://foodplanner:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/foodplanner
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-5173}:80"
    restart: unless-stopped

volumes:
  postgres-data:
