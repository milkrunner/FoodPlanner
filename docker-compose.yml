# Production Docker Compose - uses pre-built images from GitHub Container Registry
# Usage:
#   1. Copy this file to your server
#   2. Create a .env file with your configuration (see below)
#   3. Run: docker compose up -d
#
# Required .env variables:
#   GEMINI_API_KEY=your_api_key_here
#
# Optional .env variables:
#   DB_PASSWORD=your_secure_password (required)
#   VERSION=1.0.0 (default: latest)
#   PORT=5173 (default: 5173)

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodplanner-db
    environment:
      POSTGRES_DB: foodplanner
      POSTGRES_USER: foodplanner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodplanner -d foodplanner"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/milkrunner/foodplanner/backend:${VERSION:-latest}
    container_name: foodplanner-backend
    environment:
      NODE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql://foodplanner:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/foodplanner
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ghcr.io/milkrunner/foodplanner/frontend:${VERSION:-latest}
    container_name: foodplanner-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-5173}:80"
    restart: unless-stopped

volumes:
  postgres-data:
