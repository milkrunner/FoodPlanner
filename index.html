<!DOCTYPE html>
<html lang="de" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#3B82F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1F2937" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Plane deine Mahlzeiten für die Woche, verwalte Rezepte und erstelle Einkaufslisten">
    <meta name="application-name" content="Food Planner">
    <meta name="apple-mobile-web-app-title" content="Food Planner">
    <meta name="msapplication-TileColor" content="#3B82F6">
    <meta name="msapplication-config" content="none">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-128x128.png">
    <title>Food Planner - Essenswochenplaner</title>
    <style>
        /* Critical CSS - Inline for fast initial render */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: env(safe-area-inset-bottom, 0);
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* Mobile-first touch targets - minimum 44x44px */
        button, a, input, select, textarea, [role="button"] {
            min-height: 44px;
            min-width: 44px;
        }
        input[type="checkbox"], input[type="radio"] {
            min-height: 24px;
            min-width: 24px;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 50;
            overscroll-behavior: contain;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        /* Mobile: modals slide up from bottom */
        @media (max-width: 640px) {
            .modal.active {
                align-items: flex-end;
                padding: 0;
            }
            .modal.active > div {
                border-radius: 1rem 1rem 0 0;
                max-height: 90vh;
                width: 100%;
                animation: slideUpModal 0.3s ease-out;
            }
        }
        .dark .modal {
            background-color: rgba(0, 0, 0, 0.7);
        }

        /* Animations */
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes slideUpModal {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out;
        }
        #toast-notification {
            transition: opacity 0.2s ease-out;
        }

        .favorite-heart {
            color: #9ca3af;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .favorite-heart:hover {
            transform: scale(1.08);
        }
        .favorite-heart.is-favorite {
            color: #ef4444;
        }
        .dark .favorite-heart {
            color: #6b7280;
        }
        .dark .favorite-heart.is-favorite {
            color: #f87171;
        }
        .favorite-heart-animate {
            animation: heartBounce 0.35s ease-in-out;
        }
        @keyframes heartBounce {
            0% { transform: scale(1); }
            40% { transform: scale(1.3); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .favorite-highlight {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35);
            transition: box-shadow 0.3s ease;
        }
        .dark .favorite-highlight {
            box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.4);
        }
        .favorite-quick-scroll {
            scrollbar-width: thin;
        }
        .favorite-quick-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .favorite-quick-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(239, 68, 68, 0.35);
            border-radius: 9999px;
        }
        .favorite-quick-scroll::-webkit-scrollbar-track {
            background-color: rgba(239, 68, 68, 0.15);
        }

        /* Mobile toast positioning */
        @media (max-width: 640px) {
            #toast-notification {
                left: 1rem !important;
                right: 1rem !important;
                bottom: calc(1rem + env(safe-area-inset-bottom, 0)) !important;
                width: auto !important;
            }
        }

        /* Mobile navigation */
        .mobile-nav-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .mobile-nav-overlay.active {
            display: block;
            opacity: 1;
        }
        .mobile-nav-menu {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            max-width: 80vw;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 45;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .mobile-nav-menu.active {
            transform: translateX(0);
        }

        /* Pull to refresh indicator */
        .pull-to-refresh {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-100%);
            transition: transform 0.2s ease;
            z-index: 30;
        }
        .pull-to-refresh.visible {
            transform: translateY(0);
        }
        .pull-to-refresh.refreshing svg {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Swipe navigation indicator */
        .swipe-indicator {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 25;
        }
        .swipe-indicator.left { left: 0; }
        .swipe-indicator.right { right: 0; }
        .swipe-indicator.visible { opacity: 0.8; }

        /* Loading skeleton for mobile */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #374151 25%, #4B5563 50%, #374151 75%);
            background-size: 200% 100%;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Large touch checkboxes */
        .touch-checkbox {
            width: 28px !important;
            height: 28px !important;
            cursor: pointer;
        }
        @media (max-width: 640px) {
            .touch-checkbox {
                width: 32px !important;
                height: 32px !important;
            }
        }

        /* Markdown recipe instructions styling */
        .recipe-instructions {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(236, 233, 255, 0.92));
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 28px 60px -48px rgba(79, 70, 229, 0.8);
            padding: 1.5rem;
        }
        .dark .recipe-instructions {
            background: linear-gradient(145deg, rgba(21, 24, 39, 0.92), rgba(51, 36, 68, 0.85));
            border-color: rgba(129, 140, 248, 0.35);
            box-shadow: 0 32px 60px -44px rgba(129, 140, 248, 0.85);
        }
        .recipe-instructions h1,
        .recipe-instructions h2,
        .recipe-instructions h3 {
            font-weight: 600;
            margin: 1.25rem 0 0.75rem;
        }
        .recipe-instructions h2 {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.1rem;
            border-radius: 9999px;
            font-size: 1.05rem;
            background: rgba(129, 140, 248, 0.15);
            color: #4338ca;
            box-shadow: inset 0 0 0 1px rgba(129, 140, 248, 0.25);
            letter-spacing: 0.01em;
        }
        .dark .recipe-instructions h2 {
            background: rgba(129, 140, 248, 0.23);
            color: #c7d2fe;
            box-shadow: inset 0 0 0 1px rgba(129, 140, 248, 0.35);
        }
        .recipe-instructions h3 {
            font-size: 1rem;
            color: #4f46e5;
        }
        .dark .recipe-instructions h3 {
            color: #c4b5fd;
        }
        .recipe-instructions p {
            margin: 0.6rem 0;
            line-height: 1.8;
            color: #1f2937;
        }
        .dark .recipe-instructions p {
            color: #e5e7eb;
        }
        .recipe-instructions strong {
            font-weight: 700;
            color: #312e81;
        }
        .dark .recipe-instructions strong {
            color: #ede9fe;
        }
        .recipe-instructions em {
            font-style: italic;
            color: #6b7280;
        }
        .dark .recipe-instructions em {
            color: #d1d5db;
        }
        .recipe-instructions blockquote {
            margin: 1rem 0;
            padding: 0.9rem 1.2rem;
            border-left: 4px solid rgba(129, 140, 248, 0.5);
            border-radius: 0.9rem;
            background: rgba(99, 102, 241, 0.12);
            color: #312e81;
        }
        .dark .recipe-instructions blockquote {
            background: rgba(129, 140, 248, 0.16);
            color: #e0e7ff;
        }
        .recipe-instructions hr {
            border: none;
            height: 1px;
            margin: 1.5rem 0;
            background: linear-gradient(90deg, rgba(129, 140, 248, 0), rgba(129, 140, 248, 0.45), rgba(129, 140, 248, 0));
        }
        .recipe-instructions code {
            font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace;
            background: rgba(129, 140, 248, 0.12);
            border-radius: 0.45rem;
            padding: 0.15rem 0.45rem;
            font-size: 0.85em;
        }
        .dark .recipe-instructions code {
            background: rgba(129, 140, 248, 0.22);
        }
        .recipe-instructions ol {
            counter-reset: instruction-step;
            list-style: none;
            margin: 1rem 0 1.2rem;
            padding: 0;
        }
        .recipe-instructions ol > li {
            position: relative;
            counter-increment: instruction-step;
            margin: 0.85rem 0;
            padding: 1rem 1.2rem 1rem 3.5rem;
            border-radius: 1.1rem;
            border: 1px solid rgba(129, 140, 248, 0.22);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 20px 40px -30px rgba(79, 70, 229, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .dark .recipe-instructions ol > li {
            background: rgba(28, 31, 53, 0.9);
            border-color: rgba(129, 140, 248, 0.35);
            box-shadow: 0 24px 46px -32px rgba(129, 140, 248, 0.6);
        }
        .recipe-instructions ol > li:hover {
            transform: translateY(-2px);
            box-shadow: 0 28px 44px -30px rgba(79, 70, 229, 0.55);
        }
        .dark .recipe-instructions ol > li:hover {
            box-shadow: 0 32px 50px -34px rgba(129, 140, 248, 0.65);
        }
        .recipe-instructions ol > li::before {
            content: counter(instruction-step);
            position: absolute;
            left: 1.2rem;
            top: 1.1rem;
            width: 2.35rem;
            height: 2.35rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 18px 30px -24px rgba(129, 140, 248, 0.9);
            transform: none;
        }
        .recipe-instructions ul {
            list-style: none;
            margin: 0.75rem 0;
            padding: 0;
        }
        .recipe-instructions ul > li {
            position: relative;
            margin: 0.5rem 0;
            padding-left: 2rem;
            line-height: 1.7;
            color: #1f2937;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .dark .recipe-instructions ul > li {
            color: #e5e7eb;
        }
        .recipe-instructions ul > li::before {
            content: '';
            position: absolute;
            left: 0.8rem;
            top: 0.7rem;
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15);
        }
        .recipe-instructions ul > li:hover {
            transform: translateX(4px);
        }
        .dark .recipe-instructions ul > li::before {
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div id="app"></div>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="app.js?v=20260106h"></script>
</body>
</html>
