# Test Docker Compose - Standalone PostgreSQL for integration tests
# Usage:
#   1. Start: docker compose -f docker-compose.test.yml up -d
#   2. Run:   docker exec -e DATABASE_URL='postgresql://foodplanner_test:test_secret@localhost:5433/foodplanner_test' \
#             -e JWT_SECRET=test-secret -e NODE_ENV=test \
#             foodplanner-backend npm run test:integration
#
# Alternative: Use the dev postgres (no extra container needed):
#   1. Create DB: docker exec foodplanner-db psql -U foodplanner -c 'CREATE DATABASE foodplanner_test'
#   2. Run tests: docker exec -e DATABASE_URL='postgresql://foodplanner:foodplanner_secret@postgres:5432/foodplanner_test' \
#                 -e JWT_SECRET=test-secret -e NODE_ENV=test -e LOG_LEVEL=error \
#                 foodplanner-backend sh -c 'node --test --test-reporter spec __tests__/integration/auth.integration.test.js && \
#                   node --test --test-reporter spec __tests__/integration/recipes.integration.test.js && \
#                   node --test --test-reporter spec __tests__/integration/shopping.integration.test.js'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: foodplanner-db-test
    environment:
      POSTGRES_DB: foodplanner_test
      POSTGRES_USER: foodplanner_test
      POSTGRES_PASSWORD: test_secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodplanner_test -d foodplanner_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
