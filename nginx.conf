events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /usr/share/nginx/html;

        # Frontend
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Service Worker - must not be cached
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Service-Worker-Allowed "/";
        }

        # PWA Manifest
        location = /manifest.json {
            add_header Cache-Control "public, max-age=86400";
            types { application/manifest+json json; }
        }

        # PWA Icons
        location /icons/ {
            add_header Cache-Control "public, max-age=604800";
        }

        # JS/CSS files - revalidate on each load (ETag-based)
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache";
        }

        # Backend API - all backend routes proxied to Node.js
        location ~ ^/(recipes|weekplan|shopping|pantry|cooking-history|health|auth|ai|seasons|admin|api-docs) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
