name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict permissions to minimum required
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests (no npm required)
        working-directory: ./backend
        run: node --test --test-reporter spec __tests__/middleware/*.test.js __tests__/routes/*.test.js __tests__/utils/*.test.js
