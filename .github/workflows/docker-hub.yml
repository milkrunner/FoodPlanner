name: Build & Push Docker Hub Image

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: milkrunner/foodplanner

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          PKG_VERSION=$(node -p "require('./backend/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${{ github.ref_type }}" == "tag" && "$TAG_VERSION" == *"-beta"* ]]; then
            echo "tags=${IMAGE_NAME}:${TAG_VERSION},${IMAGE_NAME}:beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${IMAGE_NAME}:${TAG_VERSION},${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tags=${IMAGE_NAME}:${PKG_VERSION},${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tags=${IMAGE_NAME}:beta-${PKG_VERSION},${IMAGE_NAME}:beta" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
