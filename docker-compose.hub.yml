# Docker Hub Deployment - All-in-One Image + PostgreSQL
# Usage:
#   1. Create .env file (see below)
#   2. Run: docker compose -f docker-compose.hub.yml up -d
#
# Required .env variables:
#   DB_PASSWORD=your_secure_db_password
#   JWT_SECRET=your_secure_jwt_secret
#
# Optional .env variables:
#   GEMINI_API_KEY=your_gemini_api_key
#   PORT=80 (default: 80)
#   VERSION=latest

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodplanner-db
    environment:
      POSTGRES_DB: foodplanner
      POSTGRES_USER: foodplanner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodplanner -d foodplanner"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: milkrunner/foodplanner:${VERSION:-latest}
    container_name: foodplanner
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://foodplanner:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/foodplanner
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres-data:
