<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Food Planner Favicon</title>
  <desc id="desc">Animal Crossing style food planner icon with plate and utensils</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DBEA8"/>
      <stop offset="100%" stop-color="#2EAF9B"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9F7"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EC850"/>
      <stop offset="100%" stop-color="#5EBA30"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <!-- Decorative dots -->
  <circle cx="8" cy="8" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="56" cy="56" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="12" cy="52" r="1.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="52" cy="12" r="1.5" fill="rgba(255,255,255,0.2)"/>
  <!-- Plate -->
  <ellipse cx="32" cy="36" rx="20" ry="16" fill="url(#plateGrad)" opacity="0.95"/>
  <ellipse cx="32" cy="36" rx="14" ry="11" fill="none" stroke="#E8F6F3" stroke-width="1.5"/>
  <!-- Cute food - rice ball style -->
  <ellipse cx="32" cy="34" rx="10" ry="9" fill="#FFFEF8"/>
  <ellipse cx="32" cy="36" rx="7" ry="4" fill="#1F352F" opacity="0.8"/>
  <!-- Leaf decoration -->
  <path d="M42 22 Q48 18 50 24 Q48 30 42 26 Q44 24 42 22" fill="url(#leafGrad)"/>
  <path d="M43 24 L47 23" stroke="#3A761E" stroke-width="1" fill="none"/>
  <!-- Fork -->
  <g transform="translate(14, 20) rotate(-30)">
    <rect x="0" y="0" width="2.5" height="14" rx="1" fill="#FFD93D"/>
    <rect x="-1" y="-4" width="1.5" height="5" rx="0.5" fill="#FFD93D"/>
    <rect x="1" y="-4" width="1.5" height="5" rx="0.5" fill="#FFD93D"/>
    <rect x="3" y="-4" width="1.5" height="5" rx="0.5" fill="#FFD93D"/>
  </g>
  <!-- Spoon -->
  <g transform="translate(46, 22) rotate(30)">
    <ellipse cx="2" cy="-2" rx="4" ry="5" fill="#FFD93D"/>
    <rect x="0.5" y="2" width="3" height="12" rx="1" fill="#FFD93D"/>
  </g>
</svg>
